<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="36" fill="url(#bg)"/>

  <circle cx="120" cy="95" r="44" fill="#ffffff" opacity="0.18"/>
  <circle cx="710" cy="410" r="72" fill="#ffffff" opacity="0.12"/>
  <path d="M0 390 C180 300, 300 500, 480 390 S700 300, 800 360 V500 H0 Z"
        fill="#ffffff" opacity="0.14"/>

  <g filter="url(#shadow)">
    <rect x="150" y="120" width="500" height="260" rx="28" fill="#ffffff" opacity="0.94"/>
  </g>

  <g transform="translate(240 175)">
    <path d="M70 0 L140 40 L140 120 L70 160 L0 120 L0 40 Z"
          fill="#7c3aed"/>
    <path d="M70 24 L118 52 L118 108 L70 136 L22 108 L22 52 Z"
          fill="#ffffff" opacity="0.92"/>
    <circle cx="70" cy="80" r="24" fill="#06b6d4"/>
  </g>

  <text x="430" y="220"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="44" font-weight="700"
        text-anchor="middle" fill="#172033">Sample SVG</text>

  <text x="430" y="270"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="20"
        text-anchor="middle" fill="#52606d">Scalable • Editable • Lightweight</text>

  <rect x="350" y="305" width="160" height="44" rx="22" fill="#172033"/>
  <text x="430" y="334"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="16" font-weight="600"
        text-anchor="middle" fill="#ffffff">Hello, SVG!</text>
</svg>
