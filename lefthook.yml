# lefthook.yml

pre-commit:
  parallel: false

  commands:
    environment-paths:
      run: node .github/scripts/check-environment-paths.mjs

    format:
      glob: "*.{ts,tsx,js,jsx,json,jsonc,md,html,css}"
      run: npx --no -- oxfmt --config ./oxfmt.config.ts --write {staged_files}
      stage_fixed: true

    lint:
      glob: "*.{ts,tsx,js,jsx}"
      run: npx --no oxlint {staged_files}

commit-msg:
  parallel: false

  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-push:
  parallel: false

  commands:
    typecheck:
      run: npm run check:all

    build:
      run: npm run build

    # Playwright E2E runs only when the packaged test suite (or its config)
    # changed. It packages the current runner VSIX and runs the wide packaged
    # conversion smoke; the full wide+narrow suite is a local/release concern.
    playwright-smoke:
      glob: "{test/playwright/**,playwright.config.mjs}"
      run: npm run package:vsix && npm run test:playwright:vsix -- --project=vscode-electron electron/packaged_conversion_smoke.spec.ts
