# lefthook.yml

pre-commit:
  parallel: false

  commands:
    format:
      glob: '*.{ts,tsx,js,jsx,json,jsonc,md,html,css}'
      exclude: 'package-lock.json'
      run: npx --no -- oxfmt --config ./oxfmt.config.ts --write {staged_files}
      stage_fixed: true

    lint:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs}'
      run: npx --no oxlint {staged_files}

commit-msg:
  parallel: false

  commands:
    commitlint:
      run: npx --no -- commitlint --edit {1}

pre-push:
  parallel: false

  commands:
    verify:
      run: npm run check
