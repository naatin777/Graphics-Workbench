name: Setup Node and npm dependencies

description: >-
  Install the pinned Node/npm versions, restore the npm cache, and install
  dependencies. Replaces the repetitive setup blocks that used to be
  duplicated across every workflow job.

inputs:
  npm-install-command:
    description: >-
      Command to install dependencies. Defaults to `npm ci`; package jobs use
      `npm ci --include=optional` with optional --os/--cpu/--libc flags.
    required: false
    default: npm ci
  cache-key-segment:
    description: >-
      Middle segment of the npm cache key. Empty by default, which resolves to
      the runner OS/arch (for example `linux-x64`); package jobs pass the
      target value.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-node

    - id: npm_cache
      name: Locate npm cache
      run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
      shell: bash

    - id: cache_key_segment
      name: Resolve npm cache key segment
      shell: bash
      run: |
        if [[ -n "${{ inputs.cache-key-segment }}" ]]; then
          echo "value=${{ inputs.cache-key-segment }}" >> "$GITHUB_OUTPUT"
        else
          echo "value=${{ runner.os }}-${{ runner.arch }}" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.npm_cache.outputs.dir }}
        key: npm-${{ steps.cache_key_segment.outputs.value }}-node-24.15.0-npm-12.0.1-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          npm-${{ steps.cache_key_segment.outputs.value }}-node-24.15.0-npm-12.0.1-

    - run: ${{ inputs.npm-install-command }}
      shell: bash
