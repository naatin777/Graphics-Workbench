name: Release VSCode Extension

on:
    push:
        tags:
            - 'v*.*.*'

permissions:
    contents: read

jobs:
    check:
        name: Release static checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup

            - run: npm run check:all
              shell: bash

    extension-host:
        name: Release Extension Host (${{ matrix.label }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      label: Linux
                      test_command: xvfb-run npm run test:coverage:run
                    - os: macos-latest
                      label: macOS
                      test_command: npm run test:coverage:run
                    - os: windows-latest
                      label: Windows
                      test_command: npm run test:coverage:run
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup

            - name: Build extension and Webview
              run: npm run build
              shell: bash

            - if: matrix.os == 'ubuntu-latest'
              run: bash .github/scripts/install-test-tools-linux.sh
              shell: bash

            - if: matrix.os == 'macos-latest'
              run: bash .github/scripts/install-image-tools-macos.sh
              shell: bash

            - if: matrix.os == 'windows-latest'
              run: .github/scripts/install-image-tools-windows.ps1
              shell: pwsh

            - if: matrix.os != 'windows-latest'
              run: bash .github/scripts/verify-image-tools-unix.sh
              shell: bash

            - if: matrix.os == 'windows-latest'
              run: .github/scripts/verify-image-tools-windows.ps1
              shell: pwsh

            - name: Run Extension Host tests
              run: ${{ matrix.test_command }}
              shell: bash
              env:
                  GRAPHICS_WORKBENCH_VSCODE_TEST_USER_DATA_DIR: .vscode-test-release-data

            - if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: release-extension-host-${{ matrix.label }}
                  path: .vscode-test-release-data/
                  if-no-files-found: ignore

            - if: always()
              name: Cleanup Extension Host test data
              run: |
                  node --input-type=module -e "import { rm } from 'node:fs/promises'; await rm('.vscode-test-release-data', { recursive: true, force: true, maxRetries: 20, retryDelay: 200 });"
              shell: bash

    webview:
        name: Release Webview tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup

            - run: npm run test:webview:coverage
              shell: bash

    package:
        name: Package VSIX (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: win32-x64
                      os: windows-latest
                      label: Windows x64
                      npm_os: ''
                      npm_cpu: ''
                      libc: ''
                    - target: win32-arm64
                      os: ubuntu-latest
                      label: Windows ARM64 (cross)
                      npm_os: win32
                      npm_cpu: arm64
                      libc: ''
                    - target: darwin-x64
                      os: macos-15-intel
                      label: Intel macOS
                      npm_os: ''
                      npm_cpu: ''
                      libc: ''
                    - target: darwin-arm64
                      os: macos-latest
                      label: Apple Silicon macOS
                      npm_os: ''
                      npm_cpu: ''
                      libc: ''
                    - target: linux-x64
                      os: ubuntu-latest
                      label: Linux x64
                      npm_os: ''
                      npm_cpu: ''
                      libc: ''
                    - target: linux-arm64
                      os: ubuntu-24.04-arm
                      label: Linux ARM64
                      npm_os: ''
                      npm_cpu: ''
                      libc: ''
        steps:
            - uses: actions/checkout@v7

            - name: Validate tag matches package.json version
              shell: bash
              run: |
                  TAG="${{ github.ref_name }}"
                  PKG_VERSION="v$(node -p "require('./vscode/package.json').version")"
                  if [[ "$TAG" != "$PKG_VERSION" ]]; then
                    echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
                    exit 1
                  fi

            - uses: ./.github/actions/setup
              with:
                  cache-key-segment: target-${{ matrix.target }}
                  npm-install-command: |
                      if [[ -n "${{ matrix.npm_os }}" ]]; then
                        npm_ci_args=(ci --include=optional --os="${{ matrix.npm_os }}" --cpu="${{ matrix.npm_cpu }}")
                        if [[ -n "${{ matrix.libc }}" ]]; then
                          npm_ci_args+=(--libc="${{ matrix.libc }}")
                        fi
                        npm "${npm_ci_args[@]}"
                      else
                        npm ci --include=optional
                      fi

            - name: Build extension and Webview
              run: npm run build
              shell: bash

            - name: Verify installed sharp target
              run: node scripts/verify-vsix.mjs --check-install --target "${{ matrix.target }}"
              shell: bash

            - if: matrix.npm_os == ''
              name: Smoke test sharp on native runner
              run: node core/scripts/test-sharp.mjs
              shell: bash

            - name: Package target VSIX
              run: npm run package:vsix -- --target "${{ matrix.target }}" --out "graphics-workbench-${{ matrix.target }}.vsix"
              shell: bash

            - name: Verify VSIX contents
              run: node scripts/verify-vsix.mjs --vsix "graphics-workbench-${{ matrix.target }}.vsix" --target "${{ matrix.target }}"
              shell: bash

            - uses: actions/upload-artifact@v4
              with:
                  name: vsix-${{ matrix.target }}
                  path: graphics-workbench-${{ matrix.target }}.vsix
                  if-no-files-found: error

    package-smoke:
        name: Package and smoke test (${{ matrix.label }})
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      label: Linux
                      test_command: xvfb-run npm run test:e2e
                      artifact_suffix: linux
                    - os: macos-latest
                      label: macOS
                      test_command: npm run test:e2e
                      artifact_suffix: macos
                    - os: windows-latest
                      label: Windows
                      test_command: npm run test:e2e
                      artifact_suffix: windows
        steps:
            - uses: actions/checkout@v7

            - name: Validate tag matches package.json version
              shell: bash
              run: |
                  TAG="${{ github.ref_name }}"
                  PKG_VERSION="v$(node -p "require('./vscode/package.json').version")"
                  if [[ "$TAG" != "$PKG_VERSION" ]]; then
                    echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
                    exit 1
                  fi

            - uses: ./.github/actions/setup

            - name: Build extension and Webview
              run: npm run build
              shell: bash

            - if: matrix.os == 'ubuntu-latest'
              run: bash .github/scripts/install-test-tools-linux.sh
              shell: bash
              env:
                INSTALL_DRAWIO: "1"

            - if: matrix.os == 'macos-latest'
              run: bash .github/scripts/install-image-tools-macos.sh
              shell: bash
              env:
                INSTALL_DRAWIO: "1"

            - if: matrix.os == 'windows-latest'
              run: .github/scripts/install-image-tools-windows.ps1
              shell: pwsh
              env:
                INSTALL_DRAWIO: "1"

            - if: matrix.os != 'windows-latest'
              run: bash .github/scripts/verify-image-tools-unix.sh
              shell: bash
              env:
                INSTALL_DRAWIO: "1"

            - if: matrix.os == 'windows-latest'
              run: .github/scripts/verify-image-tools-windows.ps1
              shell: pwsh
              env:
                INSTALL_DRAWIO: "1"

            - name: Package current runner VSIX
              run: npm run package:vsix -- --out "graphics-workbench-${{ matrix.label }}.vsix"
              shell: bash

            - name: Prepare Playwright VSIX path
              run: cp "graphics-workbench-${{ matrix.label }}.vsix" graphics-workbench.vsix
              shell: bash

            - name: Install Playwright Chromium
              shell: bash
              run: |
                  if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
                    sudo npx playwright install --with-deps chromium
                  else
                    npx playwright install chromium
                  fi

            - name: Run Playwright browser E2E against the Vite dev server
              run: ${{ matrix.test_command }}
              shell: bash

            - if: success()
              name: Capture visual review screenshots
              run: npm run visual:capture
              shell: bash

            - if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: webview-browser-playwright-${{ matrix.artifact_suffix }}
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore

            - if: success()
              uses: actions/upload-artifact@v4
              with:
                  name: release-smoke-vsix-${{ matrix.artifact_suffix }}
                  path: graphics-workbench-${{ matrix.label }}.vsix
                  if-no-files-found: error

            - if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: release-visual-review-${{ matrix.artifact_suffix }}
                  path: artifacts/visual-review/
                  if-no-files-found: ignore
                  retention-days: 14

    publish-github:
        name: Publish GitHub Release
        needs:
            - check
            - extension-host
            - webview
            - package
            - package-smoke
            - publish-marketplace
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7

            - uses: actions/download-artifact@v4
              with:
                  pattern: vsix-*
                  merge-multiple: true
                  path: .

            - name: GitHub Release (VSIX + Full Changelog compare link)
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  repo="${{ github.repository }}"
                  tag="${{ github.ref_name }}"
                  prev=$(gh api "repos/$repo/releases/latest" --jq .tag_name 2>/dev/null || true)
                  if [[ -n "$prev" ]]; then
                    notes="**Full Changelog**: https://github.com/$repo/compare/$prev...$tag"
                  else
                    notes="**Full Changelog**: https://github.com/$repo/commits/$tag"
                  fi
                  if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
                    gh release upload "$tag" ./*.vsix --repo "$repo" --clobber
                  else
                    gh release create "$tag" ./*.vsix --repo "$repo" --notes "$notes"
                  fi

    publish-marketplace:
        name: Publish Visual Studio Marketplace
        needs:
            - check
            - extension-host
            - webview
            - package
            - package-smoke
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        env:
            AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
            AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
            AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup

            - uses: actions/download-artifact@v4
              with:
                  pattern: vsix-*
                  merge-multiple: true
                  path: .

            - name: List and verify the six VSIX packages
              shell: bash
              run: |
                  count=0
                  for vsix in ./*.vsix; do
                    echo "$vsix"
                    count=$((count + 1))
                  done
                  if [[ "$count" != "6" ]]; then
                    echo "::error::expected 6 VSIX packages, found $count"
                    exit 1
                  fi

            - if: ${{ env.AZURE_CLIENT_ID != '' }}
              uses: azure/login@v2
              with:
                  client-id: ${{ env.AZURE_CLIENT_ID }}
                  tenant-id: ${{ env.AZURE_TENANT_ID }}
                  subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

            - if: ${{ env.AZURE_CLIENT_ID != '' }}
              name: Publish tested VSIX packages
              shell: bash
              run: |
                  for vsix in ./*.vsix; do
                    npx --no-install vsce publish --packagePath "$vsix" --azure-credential --skip-duplicate
                  done

            - if: ${{ env.AZURE_CLIENT_ID == '' }}
              name: Skip Visual Studio Marketplace publish
              shell: bash
              run: echo "Entra ID credentials are not configured; skipping Visual Studio Marketplace publish"

    publish-open-vsx:
        name: Publish Open VSX
        needs:
            - check
            - extension-host
            - webview
            - package
            - package-smoke
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            OVSX_PAT: ${{ secrets.OVSX_PAT }}
        steps:
            - uses: actions/checkout@v7

            - uses: ./.github/actions/setup

            - uses: actions/download-artifact@v4
              with:
                  pattern: vsix-*
                  merge-multiple: true
                  path: .

            - if: ${{ env.OVSX_PAT != '' }}
              name: Publish tested VSIX packages
              shell: bash
              run: |
                  for vsix in ./*.vsix; do
                    npx --no-install ovsx publish "$vsix" --pat "$OVSX_PAT"
                  done

            - if: ${{ env.OVSX_PAT == '' }}
              name: Skip Open VSX publish
              shell: bash
              run: echo "OVSX_PAT is not configured; skipping Open VSX publish"
