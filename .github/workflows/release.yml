name: Release VSCode Extension

on:
    push:
        tags:
            - 'v*.*.*'

jobs:
    check:
        name: Release static checks
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: '22.23.1'
                  package-manager-cache: false

            - run: npm install -g npm@12.0.1
              shell: bash

            - id: npm_cache
              name: Locate npm cache
              run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
              shell: bash

            - uses: actions/cache@v6
              with:
                  path: ${{ steps.npm_cache.outputs.dir }}
                  key: npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-

            - run: npm ci
              shell: bash

            - run: npm run check:all
              shell: bash

    extension-host:
        name: Release Extension Host (${{ matrix.label }})
        runs-on: ${{ matrix.os }}
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      label: Linux
                      test_command: xvfb-run npm run test:coverage:run
                    - os: macos-latest
                      label: macOS
                      test_command: npm run test:coverage:run
                    - os: windows-latest
                      label: Windows
                      test_command: npm run test:coverage:run
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: '22.23.1'
                  package-manager-cache: false

            - run: npm install -g npm@12.0.1
              shell: bash

            - id: npm_cache
              name: Locate npm cache
              run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
              shell: bash

            - uses: actions/cache@v6
              with:
                  path: ${{ steps.npm_cache.outputs.dir }}
                  key: npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-

            - run: npm ci
              shell: bash

            - name: Build extension and Webview
              run: npm run build
              shell: bash

            - if: matrix.os == 'ubuntu-latest'
              run: bash .github/scripts/install-test-tools-linux.sh
              shell: bash

            - if: matrix.os == 'macos-latest'
              run: bash .github/scripts/install-image-tools-macos.sh
              shell: bash

            - if: matrix.os == 'windows-latest'
              run: .github/scripts/install-image-tools-windows.ps1
              shell: pwsh

            - if: matrix.os != 'windows-latest'
              run: bash .github/scripts/verify-image-tools-unix.sh
              shell: bash

            - if: matrix.os == 'windows-latest'
              run: .github/scripts/verify-image-tools-windows.ps1
              shell: pwsh

            - name: Run Extension Host tests
              run: ${{ matrix.test_command }}
              shell: bash
              env:
                  GRAPHICS_WORKBENCH_VSCODE_TEST_USER_DATA_DIR: .vscode-test-release-data

            - if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: release-extension-host-${{ matrix.label }}
                  path: .vscode-test-release-data/
                  if-no-files-found: ignore

            - if: always()
              name: Cleanup Extension Host test data
              run: |
                  node --input-type=module -e "import { rm } from 'node:fs/promises'; await rm('.vscode-test-release-data', { recursive: true, force: true, maxRetries: 20, retryDelay: 200 });"
              shell: bash

    webview:
        name: Release Webview tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: '22.23.1'
                  package-manager-cache: false

            - run: npm install -g npm@12.0.1
              shell: bash

            - id: npm_cache
              name: Locate npm cache
              run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
              shell: bash

            - uses: actions/cache@v6
              with:
                  path: ${{ steps.npm_cache.outputs.dir }}
                  key: npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-

            - run: npm ci
              shell: bash

            - run: npm run test:webview:crop_pdf -- --coverage
              shell: bash

            - run: npm run test:webview:merge_pdf -- --coverage
              shell: bash

            - run: npm run test:webview:split_pdf -- --coverage
              shell: bash

    package:
        name: Package VSIX (${{ matrix.target }})
        runs-on: ubuntu-latest
        permissions:
            contents: read
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: win32-x64
                      npm_os: win32
                      npm_cpu: x64
                      libc: ''
                    - target: win32-arm64
                      npm_os: win32
                      npm_cpu: arm64
                      libc: ''
                    - target: darwin-x64
                      npm_os: darwin
                      npm_cpu: x64
                      libc: ''
                    - target: darwin-arm64
                      npm_os: darwin
                      npm_cpu: arm64
                      libc: ''
                    - target: linux-x64
                      npm_os: linux
                      npm_cpu: x64
                      libc: glibc
                    - target: linux-arm64
                      npm_os: linux
                      npm_cpu: arm64
                      libc: glibc
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: '22.23.1'
                  package-manager-cache: false

            - run: npm install -g npm@12.0.1
              shell: bash

            - name: Validate tag matches package.json version
              shell: bash
              run: |
                  TAG="${{ github.ref_name }}"
                  PKG_VERSION="v$(node -p "require('./package.json').version")"
                  if [[ "$TAG" != "$PKG_VERSION" ]]; then
                    echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
                    exit 1
                  fi

            - id: npm_cache
              name: Locate npm cache
              run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
              shell: bash

            - uses: actions/cache@v6
              with:
                  path: ${{ steps.npm_cache.outputs.dir }}
                  key: npm-target-${{ matrix.target }}-node-22.23.1-npm-12.0.1-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      npm-target-${{ matrix.target }}-node-22.23.1-npm-12.0.1-

            - run: node --version && npm --version
              shell: bash

            - name: Install target optional dependencies
              shell: bash
              run: |
                  npm_ci_args=(ci --include=optional --os="${{ matrix.npm_os }}" --cpu="${{ matrix.npm_cpu }}")
                  if [[ -n "${{ matrix.libc }}" ]]; then
                    npm_ci_args+=(--libc="${{ matrix.libc }}")
                  fi
                  npm "${npm_ci_args[@]}"

            - name: Build extension and Webview
              run: npm run build
              shell: bash

            - name: Verify installed sharp target
              run: node scripts/verify-vsix.mjs --check-install --target "${{ matrix.target }}"
              shell: bash

            - if: matrix.target == 'linux-x64'
              name: Smoke test sharp on matching runner
              run: |
                  node --input-type=module -e '
                    import sharp from "sharp";
                    const output = await sharp({ create: { width: 1, height: 1, channels: 4, background: "red" } }).png().toBuffer();
                    if (output.length === 0) throw new Error("sharp produced an empty PNG");
                  '
              shell: bash

            - name: Package target VSIX
              run: npm run package:vsix -- --target "${{ matrix.target }}" --out "graphics-workbench-${{ matrix.target }}.vsix"
              shell: bash

            - name: Verify VSIX contents
              run: node scripts/verify-vsix.mjs --vsix "graphics-workbench-${{ matrix.target }}.vsix" --target "${{ matrix.target }}"
              shell: bash

            - uses: actions/upload-artifact@v4
              with:
                  name: vsix-${{ matrix.target }}
                  path: graphics-workbench-${{ matrix.target }}.vsix
                  if-no-files-found: error

    package-smoke:
        name: Package and smoke test (${{ matrix.label }})
        runs-on: ${{ matrix.os }}
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      label: Linux
                      test_command: xvfb-run npm run test:playwright:vsix
                      artifact_suffix: linux
                    - os: macos-latest
                      label: macOS
                      test_command: npm run test:playwright:vsix
                      artifact_suffix: macos
                    - os: windows-latest
                      label: Windows
                      test_command: npm run test:playwright:vsix
                      artifact_suffix: windows
        steps:
            - uses: actions/checkout@v7

            - name: Validate tag matches package.json version
              shell: bash
              run: |
                  TAG="${{ github.ref_name }}"
                  PKG_VERSION="v$(node -p "require('./package.json').version")"
                  if [[ "$TAG" != "$PKG_VERSION" ]]; then
                    echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
                    exit 1
                  fi

            - uses: actions/setup-node@v6
              with:
                  node-version: '22.23.1'
                  package-manager-cache: false

            - run: npm install -g npm@12.0.1
              shell: bash

            - id: npm_cache
              name: Locate npm cache
              run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
              shell: bash

            - uses: actions/cache@v6
              with:
                  path: ${{ steps.npm_cache.outputs.dir }}
                  key: npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-

            - run: node --version && npm --version
              shell: bash

            - run: npm ci
              shell: bash

            - name: Build extension and Webview
              run: npm run build
              shell: bash

            - if: matrix.os == 'ubuntu-latest'
              run: bash .github/scripts/install-test-tools-linux.sh
              shell: bash

            - if: matrix.os == 'macos-latest'
              run: bash .github/scripts/install-image-tools-macos.sh
              shell: bash

            - if: matrix.os == 'windows-latest'
              run: .github/scripts/install-image-tools-windows.ps1
              shell: pwsh

            - if: matrix.os != 'windows-latest'
              run: bash .github/scripts/verify-image-tools-unix.sh
              shell: bash

            - if: matrix.os == 'windows-latest'
              run: .github/scripts/verify-image-tools-windows.ps1
              shell: pwsh

            - name: Package current runner VSIX
              run: npm run package:vsix -- --out "graphics-workbench-${{ matrix.label }}.vsix"
              shell: bash

            - name: Prepare Playwright VSIX path
              run: cp "graphics-workbench-${{ matrix.label }}.vsix" graphics-workbench.vsix
              shell: bash

            - name: Run Playwright against packaged VSIX
              run: ${{ matrix.test_command }}
              shell: bash
              env:
                  # Release checks the packaged journey, while visual review
                  # uses the uploaded Linux screenshots without pixel gating.
                  PLAYWRIGHT_VISUAL_SNAPSHOTS: 'false'

            - if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: packaged-electron-playwright-${{ matrix.artifact_suffix }}
                  path: |
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore

            - if: success()
              uses: actions/upload-artifact@v4
              with:
                  name: release-smoke-vsix-${{ matrix.artifact_suffix }}
                  path: graphics-workbench-${{ matrix.label }}.vsix
                  if-no-files-found: error

            - if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: release-playwright-screenshots-${{ matrix.artifact_suffix }}
                  path: |
                      test-results/
                      playwright-report/
                  if-no-files-found: ignore
                  retention-days: 14

    publish-github:
        name: Publish GitHub Release
        needs:
            - check
            - extension-host
            - webview
            - package
            - package-smoke
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7

            - uses: actions/download-artifact@v4
              with:
                  pattern: vsix-*
                  merge-multiple: true
                  path: .

            - name: GitHub Release (VSIX + Full Changelog compare link)
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  repo="${{ github.repository }}"
                  tag="${{ github.ref_name }}"
                  prev=$(gh api "repos/$repo/releases/latest" --jq .tag_name 2>/dev/null || true)
                  if [[ -n "$prev" ]]; then
                    notes="**Full Changelog**: https://github.com/$repo/compare/$prev...$tag"
                  else
                    notes="**Full Changelog**: https://github.com/$repo/commits/$tag"
                  fi
                  if gh release view "$tag" --repo "$repo" >/dev/null 2>&1; then
                    gh release upload "$tag" ./*.vsix --repo "$repo" --clobber
                  else
                    gh release create "$tag" ./*.vsix --repo "$repo" --notes "$notes"
                  fi

    publish-marketplace:
        name: Publish Visual Studio Marketplace
        needs:
            - check
            - extension-host
            - webview
            - package
            - package-smoke
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: '22.23.1'
                  package-manager-cache: false

            - run: npm install -g npm@12.0.1
              shell: bash

            - id: npm_cache
              name: Locate npm cache
              run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
              shell: bash

            - uses: actions/cache@v6
              with:
                  path: ${{ steps.npm_cache.outputs.dir }}
                  key: npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-

            - run: npm ci
              shell: bash

            - uses: actions/download-artifact@v4
              with:
                  pattern: vsix-*
                  merge-multiple: true
                  path: .

            - name: Publish tested VSIX packages
              shell: bash
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
              run: |
                  for vsix in ./*.vsix; do
                    npx --no-install vsce publish --packagePath "$vsix" --pat "$VSCE_PAT"
                  done

    publish-open-vsx:
        name: Publish Open VSX
        needs:
            - check
            - extension-host
            - webview
            - package
            - package-smoke
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v6
              with:
                  node-version: '22.23.1'
                  package-manager-cache: false

            - run: npm install -g npm@12.0.1
              shell: bash

            - id: npm_cache
              name: Locate npm cache
              run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
              shell: bash

            - uses: actions/cache@v6
              with:
                  path: ${{ steps.npm_cache.outputs.dir }}
                  key: npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-${{ hashFiles('package-lock.json') }}
                  restore-keys: |
                      npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-

            - run: npm ci
              shell: bash

            - uses: actions/download-artifact@v4
              with:
                  pattern: vsix-*
                  merge-multiple: true
                  path: .

            - name: Publish tested VSIX packages
              shell: bash
              env:
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}
              run: |
                  for vsix in ./*.vsix; do
                    npx --no-install ovsx publish "$vsix" --pat "$OVSX_PAT"
                  done
