name: Check

# CI is temporarily disabled (task 0224) while the development workflow is
# reorganized. Re-enable with pull_request/push triggers when ready.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: npm run check:all
        shell: bash

  terminal-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: npm run stage:tui-core
        shell: bash

      - run: bun install --cwd tui --frozen-lockfile
        shell: bash

      - run: bun run --cwd tui check
        shell: bash

      - run: bun test --cwd tui
        shell: bash
