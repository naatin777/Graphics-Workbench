name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup

      # Type-aware lint resolves '@graphics-workbench/core/*' and
      # '@graphics-workbench/vscode-protocol/*' imports against dist types, so
      # the packages must be compiled before `npm run check:all` runs lint.
      - name: Build core and protocol
        run: npm run compile:core && npm run compile:protocol
        shell: bash

      - run: npm run check:all
        shell: bash

  terminal-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14

      - run: npm run stage:tui-core
        shell: bash

      - run: bun install --cwd tui --frozen-lockfile
        shell: bash

      - run: bun run --cwd tui check
        shell: bash

      - run: bun test --cwd tui
        shell: bash
