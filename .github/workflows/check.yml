name: Check

# CI is temporarily disabled (task 0224) while the development workflow is
# reorganized. Re-enable with pull_request/push triggers when ready.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - run: npm run check:all
        shell: bash
