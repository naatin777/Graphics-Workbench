name: Playwright

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate Linux canonical Playwright snapshot artifacts
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    # Keep this job name stable: branch protection requires these three contexts.
    name: packaged Electron Playwright (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            test_command: xvfb-run npm run test:playwright:vsix
            artifact_suffix: linux
            snapshot_enabled: true
            visual_snapshots: true
          - os: macos-latest
            label: macOS
            test_command: npm run test:playwright:vsix -- --project=vscode-electron electron/packaged_conversion_smoke.spec.ts
            artifact_suffix: macos
            snapshot_enabled: false
            visual_snapshots: false
          - os: windows-latest
            label: Windows
            test_command: npm run test:playwright:vsix -- --project=vscode-electron electron/packaged_conversion_smoke.spec.ts
            artifact_suffix: windows
            snapshot_enabled: false
            visual_snapshots: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - run: npm install -g npm@12.0.1
        shell: bash

      - id: npm_cache
        name: Locate npm cache
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: actions/cache@v6
        with:
          path: ${{ steps.npm_cache.outputs.dir }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-

      - run: node --version && npm --version
        shell: bash

      - run: npm ci
        shell: bash

      - name: Build extension and Webview
        run: npm run build
        shell: bash

      - if: matrix.os == 'ubuntu-latest'
        run: bash .github/scripts/install-test-tools-linux.sh
        shell: bash

      - if: matrix.os == 'macos-latest'
        run: bash .github/scripts/install-image-tools-macos.sh
        shell: bash

      - if: matrix.os == 'windows-latest'
        run: .github/scripts/install-image-tools-windows.ps1
        shell: pwsh

      - if: matrix.os != 'windows-latest'
        run: bash .github/scripts/verify-image-tools-unix.sh
        shell: bash

      - if: matrix.os == 'windows-latest'
        run: .github/scripts/verify-image-tools-windows.ps1
        shell: pwsh

      - name: Package current runner VSIX
        run: npm run package:vsix -- --out "graphics-workbench-${{ matrix.label }}.vsix"
        shell: bash

      - name: Prepare Playwright VSIX path
        run: cp "graphics-workbench-${{ matrix.label }}.vsix" graphics-workbench.vsix
        shell: bash

      - if: matrix.snapshot_enabled == true
        name: Check for snapshot update flag
        id: snapshot_flag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
          TITLE_MESSAGE: ${{ github.event.pull_request.title || '' }}
          UPDATE_SNAPSHOTS_INPUT: ${{ inputs.update_snapshots || false }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "update_snapshots=$UPDATE_SNAPSHOTS_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            HEAD_MESSAGE="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA" --jq '.commit.message')"
          else
            HEAD_MESSAGE="$HEAD_COMMIT_MESSAGE"
          fi
          if [[ "$TITLE_MESSAGE" == *"[update-snapshots]"* ]] || [[ "$HEAD_MESSAGE" == *"[update-snapshots]"* ]]; then
            echo "update_snapshots=true" >> "$GITHUB_OUTPUT"
          else
            echo "update_snapshots=false" >> "$GITHUB_OUTPUT"
          fi

      - if: matrix.snapshot_enabled == true && steps.snapshot_flag.outputs.update_snapshots == 'true'
        name: Remove Linux snapshots before regeneration
        shell: bash
        run: |
          find test/playwright/electron -type f \
            -path '*/__snapshots__/*' \
            -name '*-linux.png' \
            -delete

      - name: Run Playwright against packaged VSIX
        if: matrix.snapshot_enabled != true || steps.snapshot_flag.outputs.update_snapshots != 'true'
        run: ${{ matrix.test_command }}
        shell: bash
        env:
          PLAYWRIGHT_VISUAL_SNAPSHOTS: ${{ matrix.visual_snapshots }}

      - name: Run Playwright against packaged VSIX (update snapshots)
        if: matrix.snapshot_enabled == true && steps.snapshot_flag.outputs.update_snapshots == 'true'
        run: ${{ matrix.test_command }} -- --update-snapshots
        shell: bash
        env:
          PLAYWRIGHT_VISUAL_SNAPSHOTS: ${{ matrix.visual_snapshots }}

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-electron-playwright-${{ matrix.artifact_suffix }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - if: success() && matrix.snapshot_enabled == true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots-linux
          path: |
            test/playwright/electron/**/__snapshots__/*-linux.png
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - if: failure() && matrix.snapshot_enabled == true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots-linux
          path: |
            test-results/**/*-actual.png
            test-results/**/*-diff.png
          if-no-files-found: ignore
          retention-days: 7

  commit-snapshots:
    name: Commit regenerated Linux snapshots
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: playwright
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check for snapshot update flag
        id: snapshot_flag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TITLE_MESSAGE: ${{ github.event.pull_request.title || '' }}
        run: |
          HEAD_MESSAGE="$(gh api "repos/$REPOSITORY/commits/$HEAD_SHA" --jq '.commit.message')"
          if [[ "$TITLE_MESSAGE" == *"[update-snapshots]"* ]] || [[ "$HEAD_MESSAGE" == *"[update-snapshots]"* ]]; then
            echo "update_snapshots=true" >> "$GITHUB_OUTPUT"
          else
            echo "update_snapshots=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.snapshot_flag.outputs.update_snapshots == 'true'
        uses: actions/download-artifact@v7
        with:
          name: playwright-screenshots-linux
          path: snapshots

      - if: steps.snapshot_flag.outputs.update_snapshots == 'true'
        name: Commit regenerated snapshots to the PR branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TITLE_MESSAGE: ${{ github.event.pull_request.title || '' }}
        run: |
          set -euo pipefail
          SNAPSHOT_COUNT="$(find snapshots -name '*-linux.png' 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$SNAPSHOT_COUNT" = "0" ]; then
            echo 'no regenerated Linux snapshots found'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find snapshots -name '*-linux.png' -exec cp {} test/playwright/electron/__snapshots__/ \;
          git add test/playwright/electron/__snapshots__/*-linux.png

          if git diff --cached --quiet; then
            echo 'snapshots unchanged'
          else
            git commit -m 'test(playwright): update Linux snapshots'
            git push origin "HEAD:${HEAD_REF}"
          fi

          CLEAN_TITLE="${TITLE_MESSAGE/'[update-snapshots]'/}"
          CLEAN_TITLE="$(echo "${CLEAN_TITLE}" | xargs)"
          if [ "${CLEAN_TITLE}" != "${TITLE_MESSAGE}" ]; then
            gh pr edit "${PR_NUMBER}" --title "${CLEAN_TITLE}"
          fi

  comment-screenshots:
    name: Comment Linux screenshots on PR
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: playwright
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          name: playwright-screenshots-linux
          path: screenshots

      - name: Post Linux screenshots to PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find screenshots -name '*-linux.png' | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo 'no Linux screenshot files found'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          SCREENSHOT_REF="ci-screenshots-${PR_NUMBER}-${GITHUB_RUN_ID}"
          rm -rf .ci-screenshots
          mkdir -p .ci-screenshots
          cp "${FILES[@]}" .ci-screenshots/
          TEMP_INDEX="$(mktemp)"
          rm -f "${TEMP_INDEX}"
          GIT_INDEX_FILE="${TEMP_INDEX}" git read-tree --empty
          GIT_INDEX_FILE="${TEMP_INDEX}" git add --all .ci-screenshots
          SCREENSHOT_TREE="$(GIT_INDEX_FILE="${TEMP_INDEX}" git write-tree)"
          SCREENSHOT_SHA="$(printf 'ci: store Linux Playwright screenshots for PR %s run %s\n\n' "${PR_NUMBER}" "${GITHUB_RUN_ID}" | git commit-tree "${SCREENSHOT_TREE}")"
          rm -f "${TEMP_INDEX}"
          git push origin "${SCREENSHOT_SHA}:refs/heads/${SCREENSHOT_REF}"

          GITHUB_SCREENSHOT_REF="${SCREENSHOT_SHA}" \
            GITHUB_REPOSITORY="${REPOSITORY}" \
            GITHUB_RUN_ID="${GITHUB_RUN_ID}" \
            node .github/scripts/render-screenshots-comment.mjs "${FILES[@]}" > /tmp/screenshots.md

          COMMENT_BODY="$(cat /tmp/screenshots.md)"
          EXISTING_ID="$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" --jq '.[] | select(.body | contains("<!-- playwright-screenshots -->")) | .id' | head -n 1)"
          if [ -n "${EXISTING_ID}" ]; then
            gh api -X PATCH "repos/${REPOSITORY}/issues/comments/${EXISTING_ID}" -f body="${COMMENT_BODY}" > /dev/null
          else
            gh api -X POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${COMMENT_BODY}" > /dev/null
          fi
