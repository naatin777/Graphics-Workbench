name: Playwright

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate OS-specific Playwright snapshot artifacts
        required: false
        default: false
        type: boolean

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify CI scope
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      run_playwright: ${{ steps.classify.outputs.run_playwright }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - if: github.event_name == 'pull_request'
        name: Fetch base ref for diff
        run: git fetch origin "${{ github.event.pull_request.base.ref }}"
        shell: bash

      - id: classify
        name: Classify changed files
        run: node .github/scripts/classify-ci-scope.mjs
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_REF: ${{ github.event.pull_request.base.ref }}
          CI_BEFORE_SHA: ${{ github.event.before }}

  playwright:
    name: packaged Electron Playwright (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    needs: classify
    if: needs.classify.outputs.scope == 'code' && needs.classify.outputs.run_playwright == 'yes'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            test_command: xvfb-run npm run test:playwright:vsix
            artifact_suffix: linux
          - os: macos-latest
            label: macOS
            test_command: npm run test:playwright:vsix
            artifact_suffix: macos
          - os: windows-latest
            label: Windows
            test_command: npm run test:playwright:vsix
            artifact_suffix: windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - run: npm install -g npm@12.0.1
        shell: bash

      - id: npm_cache
        name: Locate npm cache
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: actions/cache@v6
        with:
          path: ${{ steps.npm_cache.outputs.dir }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-

      - run: node --version && npm --version
        shell: bash

      - run: npm ci
        shell: bash

      - name: Build extension and Webview
        run: npm run build
        shell: bash

      - if: matrix.os == 'ubuntu-latest'
        run: bash .github/scripts/install-test-tools-linux.sh
        shell: bash

      - if: matrix.os == 'macos-latest'
        run: bash .github/scripts/install-image-tools-macos.sh
        shell: bash

      - if: matrix.os == 'windows-latest'
        run: .github/scripts/install-image-tools-windows.ps1
        shell: pwsh

      - if: matrix.os != 'windows-latest'
        run: bash .github/scripts/verify-image-tools-unix.sh
        shell: bash

      - if: matrix.os == 'windows-latest'
        run: .github/scripts/verify-image-tools-windows.ps1
        shell: pwsh

      - name: Package current runner VSIX
        run: npm run package:vsix -- --out "graphics-workbench-${{ matrix.label }}.vsix"
        shell: bash

      - name: Prepare Playwright VSIX path
        run: cp "graphics-workbench-${{ matrix.label }}.vsix" graphics-workbench.vsix
        shell: bash

      - name: Check for snapshot update flag
        id: snapshot_flag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "update_snapshots=${{ inputs.update_snapshots }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            HEAD_MESSAGE="$(gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}" --jq '.commit.message')"
          else
            HEAD_MESSAGE="${{ github.event.head_commit.message }}"
          fi
          TITLE_MESSAGE="${{ github.event.pull_request.title }}"
          if [[ "$TITLE_MESSAGE" == *"[update-snapshots]"* ]] || [[ "$HEAD_MESSAGE" == *"[update-snapshots]"* ]]; then
            echo "update_snapshots=true" >> "$GITHUB_OUTPUT"
          else
            echo "update_snapshots=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Remove current runner snapshots before regeneration
        if: steps.snapshot_flag.outputs.update_snapshots == 'true'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux) suffix='linux' ;;
            macOS) suffix='darwin' ;;
            Windows) suffix='win32' ;;
            *) echo "Unsupported runner OS: ${{ runner.os }}" >&2; exit 1 ;;
          esac
          find test/playwright/electron -type f \
            -path '*/__snapshots__/*' \
            -name "*-vscode-electron*-${suffix}.png" \
            -delete

      - name: Install VSIX and run Electron Playwright
        if: steps.snapshot_flag.outputs.update_snapshots != 'true'
        run: ${{ matrix.test_command }}
        shell: bash

      - name: Install VSIX and run Electron Playwright (update snapshots)
        if: steps.snapshot_flag.outputs.update_snapshots == 'true'
        run: ${{ matrix.test_command }} -- --update-snapshots
        shell: bash

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-electron-playwright-${{ matrix.artifact_suffix }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - if: success()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots-${{ matrix.artifact_suffix }}
          path: test/playwright/electron/**/__snapshots__/*.png
          if-no-files-found: ignore
          retention-days: 7

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots-${{ matrix.artifact_suffix }}
          path: |
            test-results/**/*-actual.png
            test-results/**/*-diff.png
          if-no-files-found: ignore
          retention-days: 7

  commit-snapshots:
    name: Commit regenerated snapshots
    if: github.event_name == 'pull_request' && needs.classify.outputs.scope == 'code' && needs.classify.outputs.run_playwright == 'yes'
    needs:
      - classify
      - playwright
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check for snapshot update flag
        id: snapshot_flag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD_MESSAGE="$(gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}" --jq '.commit.message')"
          TITLE_MESSAGE="${{ github.event.pull_request.title }}"
          if [[ "$TITLE_MESSAGE" == *"[update-snapshots]"* ]] || [[ "$HEAD_MESSAGE" == *"[update-snapshots]"* ]]; then
            echo "update_snapshots=true" >> "$GITHUB_OUTPUT"
          else
            echo "update_snapshots=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.snapshot_flag.outputs.update_snapshots == 'true'
        uses: actions/download-artifact@v7
        with:
          pattern: playwright-screenshots-*
          merge-multiple: true
          path: snapshots

      - if: steps.snapshot_flag.outputs.update_snapshots == 'true'
        name: Commit regenerated snapshots to the PR branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          TITLE_MESSAGE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          SNAPSHOT_COUNT="$(find snapshots -name '*.png' 2>/dev/null | wc -l | tr -d ' ')"
          if [ "$SNAPSHOT_COUNT" = "0" ]; then
            echo "no regenerated snapshots found"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p test/playwright/electron/__snapshots__
          find snapshots -name '*.png' -exec cp {} test/playwright/electron/__snapshots__/ \;
          git add test/playwright/electron/__snapshots__/*.png

          if git diff --cached --quiet; then
            echo "snapshots unchanged"
          else
            git commit -m "test(playwright): update snapshots"
            git push origin "HEAD:${HEAD_REF}"
          fi

          CLEAN_TITLE="${TITLE_MESSAGE/"[update-snapshots]"/}"
          CLEAN_TITLE="$(echo "${CLEAN_TITLE}" | xargs)"
          if [ "${CLEAN_TITLE}" != "${TITLE_MESSAGE}" ]; then
            gh pr edit "${PR_NUMBER}" --title "${CLEAN_TITLE}"
          fi

  comment-screenshots:
    name: Comment screenshots on PR
    if: github.event_name == 'pull_request' && needs.classify.outputs.scope == 'code' && needs.classify.outputs.run_playwright == 'yes'
    needs:
      - classify
      - playwright
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: playwright-screenshots-*
          merge-multiple: true
          path: screenshots

      - name: Post screenshots to PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          FILES=()
          while IFS= read -r file; do
            FILES+=("$file")
          done < <(find screenshots -name '*.png' | sort)
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "no screenshot files found"
            exit 0
          fi
          node .github/scripts/render-screenshots-comment.mjs "${FILES[@]}" > /tmp/screenshots.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .ci-screenshots
          mkdir -p .ci-screenshots
          cp "${FILES[@]}" .ci-screenshots/
          git checkout --orphan ci-screenshots
          git add .ci-screenshots
          git commit -m "ci: update Playwright screenshots"
          git push --force origin ci-screenshots

          COMMENT_BODY="$(cat /tmp/screenshots.md)"
          EXISTING_ID="$(gh api "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" --jq '.[] | select(.body | contains("<!-- playwright-screenshots -->")) | .id' | head -n 1)"
          if [ -n "${EXISTING_ID}" ]; then
            gh api -X PATCH "repos/${REPOSITORY}/issues/comments/${EXISTING_ID}" -f body="${COMMENT_BODY}" > /dev/null
          else
            gh api -X POST "repos/${REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="${COMMENT_BODY}" > /dev/null
          fi
