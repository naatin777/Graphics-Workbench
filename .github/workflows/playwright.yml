name: Playwright

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: packaged Electron Playwright (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            test_command: xvfb-run npm run test:playwright:vsix
            artifact_suffix: linux
          - os: macos-latest
            label: macOS
            test_command: npm run test:playwright:vsix
            artifact_suffix: macos
          - os: windows-latest
            label: Windows
            test_command: npm run test:playwright:vsix
            artifact_suffix: windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - run: npm install -g npm@12.0.1
        shell: bash

      - id: npm_cache
        name: Locate npm cache
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: actions/cache@v6
        with:
          path: ${{ steps.npm_cache.outputs.dir }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-

      - run: node --version && npm --version
        shell: bash

      - run: npm ci
        shell: bash

      - name: Build extension and Webview
        run: npm run build
        shell: bash

      - if: matrix.os == 'ubuntu-latest'
        run: bash .github/scripts/install-test-tools-linux.sh
        shell: bash

      - if: matrix.os == 'macos-latest'
        run: bash .github/scripts/install-image-tools-macos.sh
        shell: bash

      - if: matrix.os == 'windows-latest'
        run: .github/scripts/install-image-tools-windows.ps1
        shell: pwsh

      - if: matrix.os != 'windows-latest'
        run: bash .github/scripts/verify-image-tools-unix.sh
        shell: bash

      - if: matrix.os == 'windows-latest'
        run: .github/scripts/verify-image-tools-windows.ps1
        shell: pwsh

      - name: Package current runner VSIX
        run: npm run package:vsix -- --out "graphics-workbench-${{ matrix.label }}.vsix"
        shell: bash

      - name: Prepare Playwright VSIX path
        run: cp "graphics-workbench-${{ matrix.label }}.vsix" graphics-workbench.vsix
        shell: bash

      - name: Check for snapshot update flag
        id: snapshot_flag
        shell: bash
        run: echo "update_snapshots=${{ contains(github.event.head_commit.message, '[update-snapshots]') || contains(github.event.pull_request.title, '[update-snapshots]') }}" >> "$GITHUB_OUTPUT"

      - name: Install VSIX and run Electron Playwright
        if: steps.snapshot_flag.outputs.update_snapshots != 'true'
        run: ${{ matrix.test_command }}
        shell: bash

      - name: Install VSIX and run Electron Playwright (update snapshots)
        if: steps.snapshot_flag.outputs.update_snapshots == 'true'
        run: ${{ matrix.test_command }} -- --update-snapshots
        shell: bash

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-electron-playwright-${{ matrix.artifact_suffix }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

      - if: success() && steps.snapshot_flag.outputs.update_snapshots == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots-${{ matrix.artifact_suffix }}
          path: test/playwright/electron/**/*-snapshots/*.png
          if-no-files-found: ignore

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots-${{ matrix.artifact_suffix }}
          path: |
            test-results/**/*-actual.png
            test-results/**/*-diff.png
          if-no-files-found: ignore

  comment-screenshots:
    name: Comment screenshots on PR
    if: github.event_name == 'pull_request'
    needs: playwright
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: playwright-screenshots-*
          merge-multiple: true
          path: screenshots

      - name: Post screenshots to PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(find screenshots -name '*.png' 2>/dev/null | sort) || true
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "no screenshot files found"
            exit 0
          fi

          REPO="${{ github.repository }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          BRANCH="ci-screenshots"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -b "$BRANCH"

          rm -rf .ci-screenshots
          mkdir -p .ci-screenshots
          i=0
          for f in "${FILES[@]}"; do
            i=$((i + 1))
            cp "$f" ".ci-screenshots/$(printf 'shot-%03d.png' "$i")"
          done

          git add .ci-screenshots
          git commit -m "ci: screenshots from run ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$BRANCH"

          {
            echo "<!-- playwright-screenshots -->"
            echo "## Playwright screenshots (run ${GITHUB_RUN_ID})"
            echo ""
            for f in .ci-screenshots/*.png; do
              echo "![$(basename "$f")](https://github.com/${REPO}/raw/${BRANCH}/$(basename "$f"))"
            done
          } > /tmp/screenshots.md

          COMMENT_ID=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --jq '[.[] | select(.body | contains("playwright-screenshots"))][0].id // empty')
          if [ -n "$COMMENT_ID" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" -F body=@/tmp/screenshots.md
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/screenshots.md
          fi
