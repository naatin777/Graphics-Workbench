name: Playwright

# CI is temporarily disabled (task 0224) while the development workflow is
# reorganized. Re-enable with pull_request/push triggers when ready.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    # Keep this job name stable: branch protection requires these three contexts.
    name: packaged Electron Playwright (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            test_command: xvfb-run npm run test:playwright:smoke
            artifact_suffix: linux
          - os: macos-latest
            label: macOS
            test_command: npm run test:playwright:smoke
            artifact_suffix: macos
          - os: windows-latest
            label: Windows
            test_command: npm run test:playwright:smoke
            artifact_suffix: windows
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build extension and Webview
        run: npm run build
        shell: bash

      - if: matrix.os == 'ubuntu-latest'
        run: bash .github/scripts/install-test-tools-linux.sh
        shell: bash
        env:
          INSTALL_DRAWIO: "1"

      - if: matrix.os == 'macos-latest'
        run: bash .github/scripts/install-image-tools-macos.sh
        shell: bash
        env:
          INSTALL_DRAWIO: "1"

      - if: matrix.os == 'windows-latest'
        run: .github/scripts/install-image-tools-windows.ps1
        shell: pwsh
        env:
          INSTALL_DRAWIO: "1"

      - if: matrix.os != 'windows-latest'
        run: bash .github/scripts/verify-image-tools-unix.sh
        shell: bash
        env:
          INSTALL_DRAWIO: "1"

      - if: matrix.os == 'windows-latest'
        run: .github/scripts/verify-image-tools-windows.ps1
        shell: pwsh
        env:
          INSTALL_DRAWIO: "1"

      - name: Package current runner VSIX
        run: npm run package:vsix -- --out "graphics-workbench-${{ matrix.label }}.vsix"
        shell: bash

      - name: Prepare Playwright VSIX path
        run: cp "graphics-workbench-${{ matrix.label }}.vsix" graphics-workbench.vsix
        shell: bash

      - name: Run Playwright against packaged VSIX
        run: ${{ matrix.test_command }}
        shell: bash

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-electron-playwright-${{ matrix.artifact_suffix }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
