name: Playwright

# The packaged Electron smoke test is heavy, so it runs on main pushes (and
# manually) instead of every pull request; PR coverage is provided by the
# faster core/protocol/webview jobs in check.yml and test.yml.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    # Keep this job name stable: branch protection requires these three contexts.
    name: packaged Electron Playwright (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            test_command: xvfb-run npm run test:playwright:smoke
            artifact_suffix: linux
          - os: macos-latest
            label: macOS
            test_command: npm run test:playwright:smoke
            artifact_suffix: macos
          - os: windows-latest
            label: Windows
            test_command: npm run test:playwright:smoke
            artifact_suffix: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup

      - name: Build extension and Webview
        run: npm run build
        shell: bash

      - if: matrix.os == 'ubuntu-latest'
        run: |
          TOOL_PATHS="$(INSTALL_DRAWIO=1 bash .github/scripts/install-test-tools-linux.sh)"
          printf '%s\n' "$TOOL_PATHS" >> "$GITHUB_ENV"
        shell: bash

      - if: matrix.os == 'macos-latest'
        run: |
          TOOL_PATHS="$(INSTALL_DRAWIO=1 bash .github/scripts/install-image-tools-macos.sh)"
          printf '%s\n' "$TOOL_PATHS" >> "$GITHUB_ENV"
        shell: bash

      - if: matrix.os == 'windows-latest'
        run: |
          $env:INSTALL_DRAWIO = '1'
          $toolPaths = & .github/scripts/install-image-tools-windows.ps1
          Add-Content -Path $env:GITHUB_ENV -Value $toolPaths
        shell: pwsh

      - if: matrix.os != 'windows-latest'
        run: bash .github/scripts/verify-image-tools-unix.sh
        shell: bash
        env:
          INSTALL_DRAWIO: "1"

      - if: matrix.os == 'windows-latest'
        run: .github/scripts/verify-image-tools-windows.ps1
        shell: pwsh
        env:
          INSTALL_DRAWIO: "1"

      - name: Package current runner VSIX
        run: npm run package:vsix -- --out "graphics-workbench-${{ matrix.label }}.vsix"
        shell: bash

      - name: Prepare Playwright VSIX path
        run: cp "graphics-workbench-${{ matrix.label }}.vsix" graphics-workbench.vsix
        shell: bash

      - name: Run Playwright against packaged VSIX
        run: ${{ matrix.test_command }}
        shell: bash

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packaged-electron-playwright-${{ matrix.artifact_suffix }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
