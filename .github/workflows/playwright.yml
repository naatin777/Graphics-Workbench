name: Playwright

on:
  pull_request:
  push:
    branches:
      - main
      - "next/**"

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: packaged Electron Playwright (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            test_command: xvfb-run npm run test:playwright:vsix
            artifact_suffix: linux
          - os: macos-latest
            label: macOS
            test_command: npm run test:playwright:vsix
            artifact_suffix: macos
          - os: windows-latest
            label: Windows
            test_command: npm run test:playwright:vsix
            artifact_suffix: windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22.23.1"
          package-manager-cache: false

      - run: npm install -g npm@12.0.1
        shell: bash

      - id: npm_cache
        name: Locate npm cache
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: actions/cache@v6
        with:
          path: ${{ steps.npm_cache.outputs.dir }}
          key: npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-node-22.23.1-npm-12.0.1-

      - run: node --version && npm --version
        shell: bash

      - run: npm ci
        shell: bash

      - name: Build extension and Webview
        run: npm run build
        shell: bash

      - name: Package current runner VSIX
        run: npm run package:vsix -- --out "latex-graphics-helper-${{ matrix.label }}.vsix"
        shell: bash

      - name: Prepare Playwright VSIX path
        run: cp "latex-graphics-helper-${{ matrix.label }}.vsix" latex-graphics-helper.vsix
        shell: bash

      - name: Install VSIX and run Electron Playwright
        run: ${{ matrix.test_command }}
        shell: bash

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: packaged-electron-playwright-${{ matrix.artifact_suffix }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
