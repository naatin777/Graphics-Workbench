name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core unit/integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup

      - name: Run Core unit and integration tests
        run: npm run test -w core
        shell: bash

      - name: Run Core tests in shuffled order (fixed seed)
        run: npm run test:shuffle -w core
        shell: bash

      - name: Run Core tests in shuffled order (run-derived seed)
        if: github.event_name == 'pull_request'
        run: SEED=$(( GITHUB_RUN_NUMBER % 1000 )) npm run test:shuffle:seed -w core
        shell: bash

      - name: Run Core tests in shuffled order (main seeds)
        if: github.event_name != 'pull_request'
        run: |
          for seed in 1 42 777; do
            SEED=$seed npm run test:shuffle:seed -w core || exit 1
          done
        shell: bash

  core-external:
    name: Core external-tool integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup

      - name: Install conversion tools and inject their paths
        run: |
          TOOL_PATHS="$(INSTALL_DRAWIO=1 bash .github/scripts/install-test-tools-linux.sh)"
          printf '%s\n' "$TOOL_PATHS" | grep '^GRAPHICS_WORKBENCH_TEST_' >> "$GITHUB_ENV"
          printf '%s\n' "$TOOL_PATHS"
        shell: bash

      - name: Run Core external-tool integration tests (with Xvfb for Draw.io)
        run: xvfb-run -a npm run test:external -w core
        shell: bash

  protocol:
    name: Protocol tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup

      - name: Run protocol tests
        run: npm run test -w @graphics-workbench/vscode-protocol
        shell: bash

  extension-host-pr:
    name: Extension Host coverage (Linux, PR)
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/extension-host-coverage.yml
    with:
      os: ubuntu-latest
      label: Linux
      test_command: xvfb-run npm run test:coverage:run

  extension-host:
    name: Extension Host coverage (${{ matrix.label }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            test_command: xvfb-run npm run test:coverage:run
          - os: macos-latest
            label: macOS
            test_command: npm run test:coverage:run
          - os: windows-latest
            label: Windows
            test_command: npm run test:coverage:run
    uses: ./.github/workflows/extension-host-coverage.yml
    with:
      os: ${{ matrix.os }}
      label: ${{ matrix.label }}
      test_command: ${{ matrix.test_command }}

  webview:
    name: Webview Vitest coverage (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup

      # Webview tests import '@graphics-workbench/core/*' and
      # '@graphics-workbench/vscode-protocol/*', which resolve to dist on a
      # fresh checkout.
      - name: Build core and protocol
        run: npm run compile:core && npm run compile:protocol
        shell: bash

      - name: Run Webview tests with coverage
        run: npm run test:webview:coverage
        shell: bash

      - if: always()
        name: Upload Webview Vitest coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webview-vitest-coverage
          path: coverage/webview/
          if-no-files-found: ignore

  coverage-report:
    name: Coverage report
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs:
      - extension-host
      - webview

    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download Extension Host coverage reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: vscode-extension-host-coverage-*
          path: coverage-input
          merge-multiple: false

      - name: Download Webview coverage report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: webview-vitest-coverage
          path: coverage-input/webview-vitest-coverage

      - name: Generate coverage report
        run: node .github/scripts/render-coverage-report.mjs --input coverage-input --output coverage-report.md
        env:
          COVERAGE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Add coverage to job summary
        run: cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash
