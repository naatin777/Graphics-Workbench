name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core unit/integration (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup

      - run: bash .github/scripts/install-test-tools-linux.sh
        shell: bash

      - name: Run Core unit and integration tests
        run: npm run test -w core
        shell: bash

  protocol:
    name: Protocol tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup

      - name: Run protocol tests
        run: npm run test -w @graphics-workbench/vscode-protocol
        shell: bash

  extension-host:
    name: Extension Host coverage (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
            test_command: xvfb-run npm run test:coverage:run
          - os: macos-latest
            label: macOS
            test_command: npm run test:coverage:run
          - os: windows-latest
            label: Windows
            test_command: npm run test:coverage:run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup

      - name: Build extension and Webview
        run: npm run build
        shell: bash

      - if: matrix.os == 'ubuntu-latest'
        run: bash .github/scripts/install-test-tools-linux.sh
        shell: bash

      - if: matrix.os == 'macos-latest'
        run: bash .github/scripts/install-image-tools-macos.sh
        shell: bash

      - if: matrix.os == 'windows-latest'
        run: .github/scripts/install-image-tools-windows.ps1
        shell: pwsh

      - if: matrix.os != 'windows-latest'
        run: bash .github/scripts/verify-image-tools-unix.sh
        shell: bash

      - if: matrix.os == 'windows-latest'
        run: .github/scripts/verify-image-tools-windows.ps1
        shell: pwsh

      - name: Run VS Code Extension Host tests with coverage
        run: ${{ matrix.test_command }}
        shell: bash
        env:
          GRAPHICS_WORKBENCH_VSCODE_TEST_USER_DATA_DIR: .vscode-test-ci-data

      - if: always()
        name: Upload VS Code coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vscode-extension-host-coverage-${{ matrix.label }}
          path: coverage/vscode/
          if-no-files-found: ignore

      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extension-host-test-${{ matrix.label }}
          path: .vscode-test-ci-data/
          if-no-files-found: ignore

      - if: always()
        name: Cleanup VS Code test data
        run: |
          node --input-type=module -e "import { rm } from 'node:fs/promises'; await rm('.vscode-test-ci-data', { recursive: true, force: true, maxRetries: 20, retryDelay: 200 });"
        shell: bash

  webview:
    name: Webview Vitest coverage (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/setup

      - name: Run Webview tests with coverage
        run: npm run test:webview:coverage
        shell: bash

      - if: always()
        name: Upload Webview Vitest coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: webview-vitest-coverage
          path: coverage/webview/
          if-no-files-found: ignore

  coverage-report:
    name: Coverage report
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs:
      - extension-host
      - webview

    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download Extension Host coverage reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: vscode-extension-host-coverage-*
          path: coverage-input
          merge-multiple: false

      - name: Download Webview coverage report
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: webview-vitest-coverage
          path: coverage-input/webview-vitest-coverage

      - name: Generate coverage report
        run: node .github/scripts/render-coverage-report.mjs --input coverage-input --output coverage-report.md
        env:
          COVERAGE_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Add coverage to job summary
        run: cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"
        shell: bash
